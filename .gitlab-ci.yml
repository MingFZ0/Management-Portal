image:
  name: kalrabb/mern-stack-postgres-2025

variables:
  CURR_APP: "" #Will be changed to your React project name.  Do not modify
  SERVER_FOLDER: pha-hr-server #e.g. acb123-react-client2.  Change to YOUR project 
  CLIENT_FOLDER: client
  REACT_APP_FOLDER: client-app #e.g. acb123-react-client2.  Change to YOUR project 

.script-run-server: &script-run-server |
  echo "CURR APP:"$SERVER_FOLDER

  #Make sure directory for the app exists
  ls -lFa
  if [  ! -d "$SERVER_FOLDER" ]; then
    echo "SERVER_FOLDER not set, or directory does not exist - nothing to build!"
  else
    cd $SERVER_FOLDER 
    echo "Moved to server/ project folder"
    pwd
    ls -l
    cp -p gitlab.env .env
    echo "Start mongo in background"
    mongod --fork --logpath /var/log/mongodb/mongod.log 
    #Wait a good long time for everything to settle down
    sleep 10
    pwd
    npm install
    echo "npm install completed"
    node server.js &
    sleep 5

  #  echo "running curl API tests"
  #  echo ; echo "****Ping test"; echo
  #  curl -s http://localhost:5005/ping
  #  echo ; echo "****Collections test"; echo
  #  curl -s http://localhost:5005/managedb/collections
  #  echo ""; echo "****mycollection test"; echo ""
  #  curl -s http://localhost:5005/mycollection
  #  echo "Done"

    cd test
    echo "Run Jest tests"
    npm test db.test.js
    npm test db.users.test.js
    npm test db.departments.test.js
    npm test db.hires.test.js
    npm test api.test.js
    npm test api.users.test.js
    npm test api.departments.test.js
    npm test api.hires.test.js

  fi


.script-run-react-client: &script-run-react-client |
  echo -e "\nRunning React client script"
  cd $CI_PROJECT_DIR
  pwd
  ls -l
  cd $CLIENT_FOLDER'/'$REACT_APP_FOLDER
  pwd
  ls -lFa

  npm install
  npm run build
  ls -lFa
  echo "Copy 'dist' folder after build to gitlab public folder"
  cp -p -r dist/* $CI_PROJECT_DIR'/public/'$REACT_APP_FOLDER 
  echo "Your web page will be at" $CI_PAGES_URL'/'$REACT_APP_FOLDER


cache:
  paths:
  - node_modules/

before_script:
  - pwd
  - node --version

testrunner:
  script:
    - CI="" #Ignore warnings.  e.g. unused classes are warnings but will stop build w/o this
    - echo "Check current directory"
    - pwd
    - *script-run-server  
  stage: test

pages:
  stage: deploy
  script:
    - pwd
    - echo ">>>>Running Client build script"
    #Must have a public folder -- gitlab will copy files from there to deploy
    #CI_PROJECT_DIR is pre-defined by gitlab
    - mkdir $CI_PROJECT_DIR'/public'
    - mkdir $CI_PROJECT_DIR'/public/'$REACT_APP_FOLDER
    - CI=""
    - *script-run-react-client  

  artifacts:
    paths:
    - public
